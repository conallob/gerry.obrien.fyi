<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gerry O'Brien — AR Memorial</title>

  <!--
    WebAR experience built with A-Frame + AR.js.
    Requires HTTPS (standard on any live host) for camera access.
    Point camera at the printed Hiro marker to summon the monument.
  -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Cinzel', Georgia, serif;
    }

    /* ─── UI Overlay ─── */
    .ui-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem;
      background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, transparent 100%);
    }

    .ui-title {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e2c97c;
    }

    .ui-back {
      display: inline-block;
      color: rgba(255,255,255,.7);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.3);
      padding: 0.35rem 0.9rem;
      transition: background .2s, border-color .2s;
    }
    .ui-back:hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.5);
    }

    /* ─── Hint Banner ─── */
    #hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      white-space: nowrap;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.8);
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(200,168,75,.4);
      padding: 0.6rem 1.4rem;
      pointer-events: none;
      transition: opacity .5s ease;
    }

    /* ─── A-Frame canvas ─── */
    a-scene { position: fixed; inset: 0; }
  </style>
</head>
<body>

  <!-- ─── UI Overlay ─── -->
  <nav class="ui-bar">
    <span class="ui-title">Gerry O'Brien &mdash; Memorial</span>
    <a class="ui-back" href="index.html">&larr; Back</a>
  </nav>

  <div id="hint">Point camera at the Hiro marker</div>

  <!-- ═══════════════════════════════════════════════════
       AR SCENE
       ═══════════════════════════════════════════════════
       Scale reference: the Hiro marker = 1 A-Frame unit.
       When printed at 10 cm, 1 unit ≈ 10 cm in real space.
       The monument stands ~0.6 units (~6 cm) above the marker.
       ═══════════════════════════════════════════════════ -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">

    <!-- Global ambient light — low so the point light reads -->
    <a-light type="ambient" color="#223" intensity="0.5"></a-light>

    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- ────────────────────────────────
           PEDESTAL
           ──────────────────────────────── -->

      <!-- Wide base disc -->
      <a-cylinder
        position="0 0.04 0"
        radius="0.14"
        height="0.08"
        color="#3e3e48"
        material="roughness: 0.95; metalness: 0.08">
      </a-cylinder>

      <!-- Narrower cap disc -->
      <a-cylinder
        position="0 0.10 0"
        radius="0.09"
        height="0.04"
        color="#4a4a56"
        material="roughness: 0.92; metalness: 0.1">
      </a-cylinder>

      <!-- ────────────────────────────────
           FLOATING / ROTATING PLAQUE
           ──────────────────────────────── -->

      <!-- Outer float wrapper: gentle up-and-down drift -->
      <a-entity
        position="0 0.19 0"
        animation__float="
          property: position;
          from:     0 0.19 0;
          to:       0 0.28 0;
          dir:      alternate;
          dur:      2800;
          loop:     true;
          easing:   easeInOutSine">

        <!-- Inner rotate wrapper: slow Y-axis spin -->
        <a-entity
          animation__spin="
            property: rotation;
            to:       0 360 0;
            dur:      11000;
            loop:     true;
            easing:   linear">

          <!-- Gold plaque body -->
          <a-box
            width="0.30"
            height="0.40"
            depth="0.026"
            color="#b8922a"
            material="metalness: 0.78; roughness: 0.22">
          </a-box>

          <!-- Recessed inner face (depth impression) -->
          <a-box
            position="0 0 0.012"
            width="0.26"
            height="0.36"
            depth="0.004"
            color="#cfa23a"
            material="metalness: 0.65; roughness: 0.30">
          </a-box>

          <!-- ── FRONT: Name & years ── -->

          <a-text
            value="GERRY"
            position="0 0.115 0.016"
            align="center"
            color="#1a0e00"
            width="0.30"
            font="exo2bold"
            letter-spacing="4">
          </a-text>

          <a-text
            value="O'BRIEN"
            position="0 0.050 0.016"
            align="center"
            color="#1a0e00"
            width="0.30"
            font="exo2bold"
            letter-spacing="2">
          </a-text>

          <!-- Thin divider line -->
          <a-box
            position="0 0.005 0.016"
            width="0.22"
            height="0.003"
            depth="0.002"
            color="#1a0e00">
          </a-box>

          <!-- TODO: Replace placeholder years below -->
          <a-text
            value="1955  —  2025"
            position="0 -0.055 0.016"
            align="center"
            color="#2a1800"
            width="0.26">
          </a-text>

          <!-- ── BACK: MSc achievement ── -->

          <a-text
            value="MSc"
            position="0 0.115 -0.016"
            rotation="0 180 0"
            align="center"
            color="#1a0e00"
            width="0.26"
            font="exo2bold"
            letter-spacing="3">
          </a-text>

          <a-text
            value="Augmented Reality"
            position="0 0.042 -0.016"
            rotation="0 180 0"
            align="center"
            color="#1a0e00"
            width="0.28">
          </a-text>

          <a-text
            value="in Education"
            position="0 -0.020 -0.016"
            rotation="0 180 0"
            align="center"
            color="#1a0e00"
            width="0.28">
          </a-text>

          <!-- Thin divider on back -->
          <a-box
            position="0 0.005 -0.016"
            rotation="0 180 0"
            width="0.22"
            height="0.003"
            depth="0.002"
            color="#1a0e00">
          </a-box>

          <!-- TODO: Add university name on back if desired -->
          <!--
          <a-text
            value="University Name · Year"
            position="0 -0.07 -0.016"
            rotation="0 180 0"
            align="center"
            color="#2a1800"
            width="0.26">
          </a-text>
          -->

        </a-entity>
        <!-- /rotate -->

      </a-entity>
      <!-- /float -->

      <!-- ────────────────────────────────
           ORBITING LIGHT PARTICLES
           Represent knowledge in motion.
           ──────────────────────────────── -->

      <!-- Orbit 1 — mid height, slow, wide -->
      <a-entity
        position="0 0.22 0"
        animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
        <a-sphere
          position="0.25 0 0"
          radius="0.013"
          color="#ffd060"
          material="emissive: #cc7700; emissiveIntensity: 0.7">
        </a-sphere>
      </a-entity>

      <!-- Orbit 2 — higher, faster, counter-clockwise -->
      <a-entity
        position="0 0.30 0"
        animation="property: rotation; to: 0 -360 0; dur: 4200; loop: true; easing: linear">
        <a-sphere
          position="0.20 0.04 0.10"
          radius="0.009"
          color="#ffe88a"
          material="emissive: #bb8800; emissiveIntensity: 0.6">
        </a-sphere>
      </a-entity>

      <!-- Orbit 3 — lower, medium speed, offset angle -->
      <a-entity
        position="0 0.16 0"
        animation="property: rotation; to: 0 360 0; dur: 8500; loop: true; easing: linear">
        <a-sphere
          position="-0.22 0 0.08"
          radius="0.011"
          color="#ffcc44"
          material="emissive: #aa6600; emissiveIntensity: 0.5">
        </a-sphere>
      </a-entity>

      <!-- ────────────────────────────────
           LIGHTING
           ──────────────────────────────── -->

      <!-- Warm key light above and in front of plaque -->
      <a-light
        type="point"
        color="#ffd090"
        intensity="1.0"
        position="0 0.5 0.3"
        distance="1.6"
        decay="2">
      </a-light>

      <!-- Cool fill light from behind -->
      <a-light
        type="point"
        color="#8090cc"
        intensity="0.3"
        position="0 0.3 -0.4"
        distance="1.2"
        decay="2">
      </a-light>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('a-marker');
    const hint   = document.getElementById('hint');
    let seen = false;

    marker.addEventListener('markerFound', () => {
      seen = true;
      hint.style.opacity = '0';
      setTimeout(() => { hint.style.display = 'none'; }, 500);
    });

    marker.addEventListener('markerLost', () => {
      if (seen) {
        hint.textContent = 'Keep the marker in view';
        hint.style.display = 'block';
        hint.style.opacity = '1';
      }
    });
  </script>

</body>
</html>
